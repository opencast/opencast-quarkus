# mTLS server: HTTPS. The worker's own certificate (CN=oc-worker) is its
# identity; the CA is used to verify the client certificates of the callers
# (see certs/generate.sh, certs/README.md). CERTS_DIR can override the
# default location.
# The admin serves on 8443, so the worker uses 8444 to avoid a conflict.
#
# client-auth=request (not required): the certificate is optional at the
# TLS layer; the machine-to-machine endpoint (/capitalize) requires one via
# @Authenticated (requests without a certificate get a 401).
# insecure-requests=disabled keeps a single HTTPS port.
quarkus.http.ssl-port=8444
quarkus.tls.mtls.key-store.pem.0.cert=${CERTS_DIR:../../certs}/worker.crt
quarkus.tls.mtls.key-store.pem.0.key=${CERTS_DIR:../../certs}/worker.key
quarkus.tls.mtls.trust-store.pem.certs=${CERTS_DIR:../../certs}/ca.crt
quarkus.http.tls-configuration-name=mtls
quarkus.http.ssl.client-auth=request
quarkus.http.insecure-requests=disabled
# Mechanism-selection annotations (e.g. @MTLSAuthentication) require
# non-proactive authentication; authentication is then attempted lazily when
# a security check (e.g. @Authenticated) runs.
quarkus.http.auth.proactive=false

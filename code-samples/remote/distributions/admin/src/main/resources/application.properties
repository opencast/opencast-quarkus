# mTLS server: HTTPS. The admin's own certificate (CN=oc-admin) is also its
# client identity when it calls the worker (see certs/generate.sh,
# certs/README.md). CERTS_DIR can override the default location.
#
# client-auth=request (not required): browser users call the user-facing
# endpoints (/hello) without a client certificate; the machine-to-machine
# endpoints of the other distribution require one (enforced via
# @Authenticated there). insecure-requests=disabled keeps a single HTTPS port.
quarkus.http.ssl-port=8443
quarkus.tls.mtls.key-store.pem.0.cert=${CERTS_DIR:../../certs}/admin.crt
quarkus.tls.mtls.key-store.pem.0.key=${CERTS_DIR:../../certs}/admin.key
quarkus.tls.mtls.trust-store.pem.certs=${CERTS_DIR:../../certs}/ca.crt
quarkus.http.tls-configuration-name=mtls
quarkus.http.ssl.client-auth=request
quarkus.http.insecure-requests=disabled

# Where the capitalization service lives, and how to reach it over mTLS
quarkus.rest-client.capitalization.url=https://localhost:8444
quarkus.rest-client.capitalization.tls-configuration-name=mtls

# Two trust domains, as in production (see certs/generate.sh, certs/README.md).
#
# BROWSER-FACING: the admin serves a "public" certificate (here signed by the
# dev web-ca, stand-in for e.g. Let's Encrypt). Browsers validate this chain
# and never see the mTLS certificates.
quarkus.http.ssl-port=8443
quarkus.tls.web.key-store.pem.0.cert=${CERTS_DIR:../../certs}/admin-web.crt
quarkus.tls.web.key-store.pem.0.key=${CERTS_DIR:../../certs}/admin-web.key
# trust-store = internal mTLS CA, so machine callers (if any) are verified
# against it (client-auth=request: browsers simply don't present one)
quarkus.tls.web.trust-store.pem.certs=${CERTS_DIR:../../certs}/mtls-ca.crt
quarkus.http.tls-configuration-name=web
quarkus.http.ssl.client-auth=request
quarkus.http.insecure-requests=disabled

# MACHINE-FACING: when the admin calls the worker it presents its own
# internal machine-identity certificate (CN=oc-admin), separate from the
# browser-facing one (different issuer, lifecycle, blast radius).
quarkus.tls.mtls.key-store.pem.0.cert=${CERTS_DIR:../../certs}/admin-mtls.crt
quarkus.tls.mtls.key-store.pem.0.key=${CERTS_DIR:../../certs}/admin-mtls.key
quarkus.tls.mtls.trust-store.pem.certs=${CERTS_DIR:../../certs}/mtls-ca.crt

# Where the capitalization service lives, and how to reach it over mTLS
quarkus.rest-client.capitalization.url=https://localhost:8444
quarkus.rest-client.capitalization.tls-configuration-name=mtls

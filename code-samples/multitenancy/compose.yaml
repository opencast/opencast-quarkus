services:
  default-db:
    image: postgres
    environment:
      POSTGRES_USER: default
      POSTGRES_PASSWORD: default
      POSTGRES_DB: default
    ports:
      - "5432:5432"
    volumes:
      - ./init-db/init_default.sql:/docker-entrypoint-initdb.d/init.sql:z

  tenant1-db:
    image: postgres
    environment:
      POSTGRES_USER: user1
      POSTGRES_PASSWORD: pass1
      POSTGRES_DB: tenant1
    ports:
      - "5433:5432"
    volumes:
      - ./init-db/init_tenant1.sql:/docker-entrypoint-initdb.d/init.sql:z


  tenant2-db:
    image: postgres
    environment:
      POSTGRES_USER: user2
      POSTGRES_PASSWORD: pass2
      POSTGRES_DB: tenant2
    ports:
      - "5434:5432"
    volumes:
      - ./init-db/init_tenant2.sql:/docker-entrypoint-initdb.d/init.sql:z

digest.realm=Quarkus Digest Example

# The users of the demo, see GreetingUsers. These are plaintext passwords, which is only acceptable for a demo.
greeting.users.alice=alice-password
greeting.users.bob=bob-password

# The key that nonces are signed with: at least 32 random bytes as hex, e.g. from `openssl rand -hex 32`.
# Here it is stored encrypted, with SmallRye Config's `smallrye-config-crypto` (see the dependency of this module),
# so that only the encryption key has to be kept secret. The plain value would be:
#   digest.nonce-secret=0d1e2f3a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f9a0b1c2d3e4f50
# More about encrypted values: https://quarkus.io/guides/config-secrets
digest.nonce-secret=${aes-gcm-nopadding::DI67TgVYYwyJlnvdkTdIp6wq7_fCgAY-gTwW25QGPKy2p6EfxPy2CZTLUOwvBBpP0J1Oz67thXIw54b1dqkTl2dp8dQMZ_KLCvTQL0kXFNZ-InmQpYc7HLKqaptV}

# The encryption key for the value above. This is a demo key and only here so that the demo runs out of the box.
# In a real deployment it has to be provided from outside instead of being kept next to the encrypted value,
# and Quarkus builds the values of application.properties into the application, so neither should be a real one.
smallrye.config.secret-handler.aes-gcm-nopadding.encryption-key=demo-encryption-key

# Where a property like these can come from: system properties (-Ddigest.nonce-secret=...), environment variables
# (DIGEST_NONCE_SECRET), a .env file and more, in a fixed order of precedence. A value from a source with a higher
# precedence replaces the one in this file. See the section "Config Sources" of
# https://quarkus.io/guides/config-reference
